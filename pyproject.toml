[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blestitch"
version = "0.2.0"
description = "Passive BLE address-rotation stitching engine (v1: rule-based)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
backend = ["fastapi>=0.110", "uvicorn>=0.23", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["blestitch*"]

[tool.setuptools.package-data]
"blestitch.data" = ["*.json", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
